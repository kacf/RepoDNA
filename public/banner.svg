<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0a0a0a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0a0a0a" />
  
  <g>
    <rect width="1200" height="480" fill="url(#grid)" y="-40" />
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-40" dur="10s" repeatCount="indefinite" />
  </g>
  
  <rect width="100%" height="100%" fill="url(#fade)" />

  <!-- Animated DNA Waves in Background -->
  <path d="M -100 200 Q 100 100, 300 200 T 700 200 T 1100 200 T 1300 200" fill="none" stroke="rgba(0, 212, 255, 0.1)" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;1000" dur="8s" repeatCount="indefinite" />
  </path>
  
  <path d="M -100 200 Q 100 300, 300 200 T 700 200 T 1100 200 T 1300 200" fill="none" stroke="rgba(124, 58, 237, 0.1)" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;1000" dur="10s" repeatCount="indefinite" begin="1s" />
  </path>

  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="84px" fill="#ffffff" letter-spacing="-2px" opacity="0">
    RepoDNA
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.2s" fill="freeze" />
    <animate attributeName="y" values="230;210" dur="1.5s" begin="0.2s" fill="freeze" />
  </text>
  
  <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="300" font-size="26px" fill="#94a3b8" letter-spacing="0.5px" opacity="0">
    The definitive visual architecture index.
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.6s" fill="freeze" />
    <animate attributeName="y" values="285;265" dur="1.5s" begin="0.6s" fill="freeze" />
  </text>
</svg>
